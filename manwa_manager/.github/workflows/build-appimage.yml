name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-tk wget fuse libfuse2

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller -r requirements.txt

      - name: Build application
        run: |
          rm -rf dist build AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          pyinstaller --clean --noconfirm ManwaManager.spec
          cp -a dist/ManwaManager AppDir/usr/bin/ManwaManager
          cp index.html AppDir/usr/bin/index.html
                    cp ManwaManager.desktop AppDir/usr/share/applications/
          cp assets/manwamanager.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          cp scripts/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Create AppImage
        run: |
          ARCH=x86_64 ./appimagetool AppDir ManwaManager-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ManwaManager-x86_64-AppImage
          path: ManwaManager-x86_64.AppImage

      - name: Create release asset for tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ManwaManager-x86_64.AppImage
