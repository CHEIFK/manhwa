name: Build Windows x86

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "manwa_manager/**"
      - ".github/workflows/build-windows.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-x86:
    name: Build Windows 32-bit
    runs-on: windows-latest

    defaults:
      run:
        working-directory: manwa_manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8 x86
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86

      - name: Show Python architecture
        shell: cmd
        run: |
          python --version
          python -c "import platform; print('Architecture:', platform.architecture()[0])"

      - name: Upgrade pip
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24.1"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller<6"

      - name: Build executable
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          if exist dist rmdir /s /q dist

          python -m PyInstaller ^
            --clean ^
            --noconfirm ^
            --onefile ^
            --name ManwaManager-Windows-x86 ^
            --collect-all curl_cffi ^
            --collect-all PIL ^
            --collect-all bs4 ^
            --hidden-import tkinter ^
            --hidden-import tkinter.filedialog ^
            --add-data "index.html;." ^
            app.py

      - name: Verify executable
        shell: cmd
        run: |
          dir dist
          if not exist "dist\ManwaManager-Windows-x86.exe" exit /b 1

      - name: Upload Windows x86 EXE
        uses: actions/upload-artifact@v4
        with:
          name: ManwaManager-Windows-x86
          path: manwa_manager/dist/ManwaManager-Windows-x86.exe

      - name: Create GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: manwa_manager/dist/ManwaManager-Windows-x86.exe
